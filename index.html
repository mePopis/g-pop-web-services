<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>G Pop — Web Services</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <div class="theme-controls">
            <label class="theme-switch">
                <input id="theme-toggle" type="checkbox">
                <span class="switch-track" aria-hidden="true"></span>
                <span id="theme-label">Dark mode</span>
            </label>
        </div>
        <header>
            <p>G Pop Web Services</p>
        </header>

        <main>
            <nav aria-label="Breadcrumb">
                <ol class="breadcrumbs">
                    <li><a href="index.html">Home</a></li>
                    <li aria-current="page">My first portfolio website</li>
                </ol>
            </nav>
            <h1>Go for G Pop!</h1>
            <nav class="contents" aria-label="Contents">
                <h2>Contents</h2>
                <ol>
                    <li><a href="#section1">Section 1</a></li>
                </ol>
            </nav>
            <button class="print-button" type="button" onclick="window.print()">
                <svg 
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
                >
                <path d="M6 9V3h12v6"/>
                <path d="M6 18H3V9h18v9h-3"/>
                <path d="M6 14h12v7H6z"/>
                </svg>
                Print this page
            </button>
            <section id="section1">
                <h2>Section 1</h2>
                <p>This is the first section of my portfolio website. Here, I will showcase my projects and skills.</p>
            <section class="page-feedback" aria-labelledby="feedback-heading">
                <div class="feedback-row">
                    <h2 id="feedback-heading">Is this page useful?</h2>
                    <div class="feedback-buttons">
                        <button type="button" class="feedback-button">Yes</button>
                        <button type="button" class="feedback-button">No</button>
                    </div>
                </div>
                <p id="feedback-message" role="status"></p>
                <button id="report-toggle" class="report-button" type="button">Report a problem with this page</button>
            </section>
        </main>

        <footer>
            <p>Powered by G POP</p>
        </footer>
    <script src="script.js"></script>
    </body>
</html>
